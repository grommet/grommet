version: 2.1
defaults: &defaults
  working_directory: ~/grommet-ci
  docker:
    - image: cimg/node:22.15.0-browsers
jobs:
  checkout:
    <<: *defaults
    resource_class: large # resource class size determined by run time of jobs
    steps:
      - checkout
      - restore_cache:
          keys:
            - yarn-cache-{{ checksum "yarn.lock" }}
      - run: yarn --frozen-lockfile
      - save_cache:
          key: yarn-cache-{{ checksum "yarn.lock" }}
          paths:
            - ~/.cache
            - ./node_modules
      - persist_to_workspace:
          root: ~/grommet-ci
          paths:
            - ./
  lint:
    <<: *defaults
    resource_class: small
    steps:
      - attach_workspace:
          at: ~/grommet-ci
      - run:
          name: Running linter
          command: yarn lint
  jest:
    <<: *defaults
    resource_class: large
    steps:
      - attach_workspace:
          at: ~/grommet-ci
      - run:
          name: Running jest
          command: yarn test
  chromatic:
    <<: *defaults
    resource_class: large
    steps:
      - attach_workspace:
          at: ~/grommet-ci
      - run:
          name: Force git to use HTTPS instead of SSH
          command: git config --global url."https://github.com/".insteadOf "git@github.com:"
      - run:
          name: Running chromatic test
          command: yarn chromatic -t $CHROMATIC_TOKEN --exit-zero-on-changes
  chromatic-accept:
    <<: *defaults
    steps:
      - attach_workspace:
          at: ~/grommet-ci
      - run:
          name: Running chromatic test
          command: yarn chromatic -t $CHROMATIC_TOKEN --exit-zero-on-changes --auto-accept-changes
  build:
    <<: *defaults
    resource_class: medium+
    steps:
      - attach_workspace:
          at: ~/grommet-ci
      - run:
          name: Build
          command: yarn build
      - persist_to_workspace:
          root: ~/grommet-ci
          paths:
            - ./
  bundlesize:
    <<: *defaults
    resource_class: small
    steps:
      - attach_workspace:
          at: ~/grommet-ci
      - run:
          name: size
          command: yarn test-bundlesize
  release:
    <<: *defaults
    steps:
      - attach_workspace:
          at: ~/grommet-ci
      - run:
          command: |
            git config --global user.name "Grommet Community Bot"
            git config --global user.email "grommet@hpe.com"
            yarn release-stable
  # NOTE: the `publish` job (ungated `npm publish` on any v* tag push,
  # authenticated via the long-lived NPM_TOKEN secret) was removed in favor
  # of .github/workflows/package-release-tag-publish.yml, which requires
  # human approval (the release-publish-approval environment) and uses npm
  # OIDC Trusted Publishing instead of a long-lived token. Re-adding a
  # tag-triggered publish job here would race ahead of that approval gate.
workflows:
  build_test:
    jobs:
      - checkout:
          filters:
            tags:
              only: /.*/
      - lint:
          requires:
            - checkout
          filters:
            tags:
              only: /.*/
      - jest:
          requires:
            - checkout
          filters:
            tags:
              only: /.*/
      # requires a maintainer to apply chromatic-approved on the PR before
      # GitHub Actions approves it and spends Chromatic snapshot quota
      # excluded from tag pipelines: release tags are cut from master, which
      # is already snapshotted/accepted by chromatic-accept
      - hold-chromatic:
          type: approval
          requires:
            - checkout
          filters:
            tags:
              ignore: /.*/
            branches:
              ignore:
                - master
      - chromatic:
          context:
            - chromatic
          requires:
            - hold-chromatic
          filters:
            tags:
              ignore: /.*/
            branches:
              ignore:
                - master
      - chromatic-accept:
          context:
            - chromatic
          requires:
            - checkout
          filters:
            branches:
              only:
                - master
      - build:
          requires:
            - checkout
          filters:
            tags:
              only: /.*/
      - bundlesize:
          requires:
            - build
          filters:
            tags:
              only: /.*/
      - release:
          context:
            - grommet
          requires:
            - jest
            - chromatic-accept
            - lint
            - build
          filters:
            branches:
              only:
                - master
